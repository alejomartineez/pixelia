<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lookdev</title>
<link rel="icon" href="data:,">
<script type="importmap">{ "imports": { "three": "../vendor/three.min.js" } }</script>
<style>
  html, body { margin: 0; height: 100%; background: #10131a; overflow: hidden; }
  #view { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="view"></div>
<script type="module">
// Diorama fijo para comparar el render (PLAN-FOTO, Etapa 0): siempre la misma escena, la misma luz y la misma cámara.
// Casa de época Madera y de época Piedra, farol, árboles, un personaje, un acantilado con estratos y agua abajo,
// más el farol de muestra importado de MagicaVoxel (assets/models/farol.vox).
//
//   lookdev.html?hour=19.5              hora del día (0..24, default 15)
//   lookdev.html?render=classic|post|photo
//                                       classic = el render del juego sin acabado de cámara · post = classic + Fase A
//                                       (bloom, tonos, viñeteado y, en la cámara de cine, desenfoque) · photo (default)
//                                       = render fotográfico de PLAN-FOTO R1 (HDR con AgX, luz con rayos en el volumen)
//   lookdev.html?exposure=1.2           exposición del render fotográfico
//   lookdev.html?post=0|1               fuerza el acabado, mande lo que mande ?render
//   lookdev.html?cam=iso|cine           isométrica del juego (default) o cámara de cine baja con lente larga
//   lookdev.html?sky=flat               cielo de color plano (default: cielo físico por hora; ?sune= sol · ?skye= cielo · ?nightk= · ?moonk=)
//   lookdev.html?aoref=1                oclusión de referencia por fuerza bruta (lenta: solo para comparar con ?debug=2)
//   lookdev.html?weather=lluvia         clima (ids de WEATHER en src/core/ambience.js)
//   lookdev.html?greedy=0               mallas sin unir caras (para comparar con el greedy meshing)
//   lookdev.html?still=1                sin animación (para comparar capturas pixel a pixel)
//   lookdev.html?async=1                arma el terreno con el worker de mallas y el caché de IndexedDB
// Capturas: node tools/lookdev-shots.mjs  → shots/lookdev/
import * as THREE from 'three';
import { createPixelRenderer, addLights, setIsoCamera, Voxels, shade, meshStats, voxelMaterial, glowMaterial } from '../src/core/voxel.js';
import { createAmbience } from '../src/core/ambience-fx.js';
import { WEATHER } from '../src/core/ambience.js';
import { buildingModel, natureModel } from '../src/city/models.js';
import { avatarModel } from '../src/avatar/avatar.js';
import { loadVox } from '../src/core/vox-loader.js';

const q = new URLSearchParams(location.search);
const hour = q.has('hour') ? Number(q.get('hour')) : 15;
const render = ['classic', 'post'].includes(q.get('render')) ? q.get('render') : 'photo';
const photo = render === 'photo';
const camId = q.get('cam') === 'cine' ? 'cine' : 'iso';
const weather = WEATHER[q.get('weather')] ? q.get('weather') : 'despejado';
const useAsync = q.get('async') === '1';
const still = q.get('still') === '1';
window.__ready = false;
// en modo quieto, el azar (parpadeos, fases) sale siempre igual: dos capturas dan los mismos pixeles
if (still) { let sd = 12345; Math.random = () => (sd = (sd * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff; }

// acabado del render fotográfico: sin tinta, viñeteado de lente y los negros abajo
const num = (k, d) => q.has(k) ? Number(q.get(k)) : d;
// la lente de maqueta: ?lensvig= caída de luz en los bordes · ?ca= aberración · ?grain= grano · ?dof=0 sin desenfoque
const PHOTO = { bloom: 0.55, thr: 1.0, vignette: 0.08, contrast: 0.08, split: 0.14, exposure: num('exposure', 1.15), punch: 1.2, agxSat: 1.2, lensVig: num('lensvig', 0.55), ca: num('ca', 0.0016), grain: num('grain', 0.035) };
// ?bounce= rebote difuso · ?fog= densidad de la niebla (se multiplica de noche) · ?taa=0 sin antialias temporal
const BOUNCE = num('bounce', 0.7), FOG = num('fog', 0.03);
const SUN_K = num('sunk', 2.6), SKY_K = num('skyk', 1.5), NIGHT_DIM = num('nightdim', 0.86), LAMP_I = num('lamp', 14);
const POST = { bloom: 0.5, thr: 0.78, vignette: 0.3, contrast: 0.18, split: 0.2 };
const r = createPixelRenderer(document.getElementById('view'), {
  ortho: camId === 'iso', viewSize: q.has('view') ? Number(q.get('view')) : 11, fov: 24, background: 0xbfe9ff, outline: !photo, photo, taa: q.get('taa') !== '0',
  post: photo ? PHOTO : render === 'classic' && q.get('post') !== '1' ? false : POST,
});
const lights = addLights(r.scene, { shadowSize: 16, shadowRes: 2048 });
const amb = createAmbience(r, { lights, sky: null, place: 'city', fog: { near: 40, far: 80 } });
amb.set({ hour, weather, light: 1 }, { now: true });

// ---------- terreno: meseta con acantilado y agua ----------
const V = 8, S = 1 / V;                 // 8 vóxeles por tile, como la ciudad
const W = 8 * V, D = 7 * V, CLIFF = 14; // meseta de 8 × 7 tiles; el acantilado baja 14 vóxeles
const hash = (x, y, z) => { let h = (x * 73856093) ^ (y * 19349663) ^ (z * 83492791); return ((h >>> 0) % 1000) / 1000; };
// borde del frente recortado (entrantes y salientes), estable
const edge = (x) => Math.round(2.2 * Math.sin(x * 0.21) + 1.6 * Math.sin(x * 0.53 + 1.3) + 2);
const STRATA = ['#6f5a48', '#7d6652', '#8b735c', '#6a5f58', '#7b6f66', '#5c4c40'];
const land = new Voxels(), glowV = new Voxels();
for (let x = 0; x < W; x++) {
  const front = D - 1 - edge(x);
  for (let z = 0; z <= front; z++) {
    // el pasto (capa de arriba) en damero suave; un camino de tierra cruza entre las casas
    const path = Math.abs(z - (30 + Math.round(2 * Math.sin(x * 0.12)))) <= 2;
    land.set(x, 0, z, path ? ((x + z) % 3 ? '#c9a878' : '#bf9c6c') : (((x >> 1) + (z >> 1)) % 2 ? '#86d672' : '#8fdc7a'));
    // solo la cáscara del acantilado (frente y costados): adentro no se ve
    const shell = z >= front - 3 || x <= 0 || x >= W - 1 || z <= 0;
    if (!shell) continue;
    for (let y = 1; y <= CLIFF; y++) {
      const band = STRATA[Math.floor((y + Math.sin(x * 0.09) * 1.5 + 1.5) / 2.4) % STRATA.length];
      land.set(x, -y, z, y === 1 ? '#6fae5c' : shade(band, (hash(x, y, z) - 0.5) * 0.08));
    }
  }
  // escalones de roca al pie
  for (let k = 1; k <= 3; k++) if (hash(x >> 2, k, 7) > 0.45) land.box(x, -CLIFF, front + k, 1, Math.max(1, 5 - k * 2 + Math.round(hash(x >> 1, k, 3) * 2)), 1, STRATA[(k + 3) % STRATA.length]);
}
// vetas que brillan en el corte (lo que la Etapa 1 va a usar para teñir la roca)
for (const x0 of [14, 37, 52]) for (let i = 0; i < 6; i++) {
  const x = x0 + Math.round(Math.sin(i * 1.3) * 1.5), front = D - 1 - edge(x);
  land.remove(x, -4 - i, front); glowV.set(x, -4 - i, front, '#7fe3d2');
}
const sea = new Voxels(), bed = new Voxels();
for (let x = -10; x < W + 10; x++) for (let z = D - 12; z < D + 22; z++) {
  bed.set(x, -CLIFF - 1, z, ((x >> 2) + (z >> 2)) % 2 ? '#3b6f86' : '#3f768d');
  sea.set(x, -CLIFF + 2, z, ((x + (z >> 1)) % 7 === 0 ? '#6fc3dc' : '#58b0d0'));
}
const center = new THREE.Vector3(W * S / 2, 0, D * S / 2);
const world = new THREE.Group();
world.position.set(-center.x, 0, -center.z);
r.scene.add(world);
const geoOf = (v, o) => useAsync ? v.toGeometryAsync(o) : Promise.resolve(v.toGeometry(o));
const t0 = performance.now();
const [landG, glowG, bedG, seaG] = await Promise.all([geoOf(land, { scale: S }), geoOf(glowV, { scale: S, jitter: 0 }), geoOf(bed, { scale: S }), geoOf(sea, { scale: S, jitter: 0.02, ao: false })]);
const terrainMs = performance.now() - t0;
const mesh = (g, mat, cast = true) => { const m = new THREE.Mesh(g, mat); m.castShadow = cast; m.receiveShadow = true; world.add(m); return m; };
// el pasto queda en y = 0: la capa de arriba ocupa de -1/8 a 0
const landM = mesh(landG, voxelMaterial()); landM.position.y = -S;
mesh(glowG, glowMaterial(), false).position.y = -S;
mesh(bedG, voxelMaterial(), false).position.y = -S;
const waterMat = new THREE.MeshLambertMaterial({ vertexColors: true, transparent: true, opacity: 0.82, depthWrite: false });
// un poco más abajo que la grilla: si no, el agua pelea en profundidad con las rocas de la misma altura
const SEA_Y = -S - 0.04;
const seaM = mesh(seaG, waterMat, false); seaM.position.y = SEA_Y; seaM.renderOrder = 2;
// render fotográfico: el terreno entra al volumen de luz desde sus grillas (relleno hacia abajo: es solo cáscara)
const L = r.light;
const nightAt0 = amb.look?.glow || 0;
if (L) {
  L.setBounds(new THREE.Vector3(-5.5, -2.25, -3.75), new THREE.Vector3(5.5, 4.25, 6.5));
  const gm = new THREE.Matrix4().makeTranslation(-center.x, -S, -center.z);
  L.add(land, gm, { scale: S, fillBelow: true });
  L.add(bed, gm, { scale: S, fillBelow: true });
  L.add(glowV, gm, { scale: S, emissive: 1.2 + 2.5 * nightAt0 });
  for (const m of world.children) m.userData.noVolume = true;
  L.debug = num('debug', 0); L.aoRef = num('aoref', 0);
  if (still) L.time = 0;
  seaM.material = L.material('water');
}

// ---------- lo que va arriba ----------
const put = (obj, tx, tz, rot = 0, scale = 1) => { obj.position.set(tx, 0, tz); obj.rotation.y = rot; obj.scale.setScalar(scale); world.add(obj); return obj; };
put(buildingModel('casita', 1, { era: 1 }), 2.2, 2.0);                  // casa de época Madera
put(buildingModel('casita', 2, { era: 2 }), 5.4, 1.9);                  // casa de época Piedra
put(buildingModel('farol', 1, { era: 2 }), 3.9, 4.7);
put(natureModel('tree', 1), 0.8, 4.9);
put(natureModel('tree', 3), 7.1, 4.2);
put(natureModel('pine', 2), 7.2, 0.9);
put(natureModel('bush', 0), 1.3, 5.9);
put(natureModel('rock', 1), 6.2, 5.6);
const LOOK = { type: 'humano', build: 'recio', skin: 2, hair: 'corto', hairColor: 'castano', face: 'barba_corta', dress: 'tabardo', dressColor: 'rojo', crown: 'ninguna', acc: 'farolito' };
const person = put(avatarModel(LOOK), 4.6, 4.9, 0.5, 0.62);
// el farol importado de MagicaVoxel (16 vóxeles por tile): lo emisivo va con el material que brilla
let voxInfo = null;
try {
  const vox = await loadVox('../assets/models/farol.vox');
  const [emit, rest0] = vox.split(m => m.emissive > 0);
  // material por vóxel: cada flag de MagicaVoxel (metal, vidrio) va a su material fotográfico
  const kind = (m) => L ? L.kindOf(m) : 'solid';
  const [metal] = vox.split(m => !(m.emissive > 0) && kind(m) === 'metal'), [glass] = vox.split(m => !(m.emissive > 0) && kind(m) === 'glass');
  const [rest] = vox.split(m => !(m.emissive > 0) && kind(m) !== 'metal' && kind(m) !== 'glass');
  const g = new THREE.Group();
  const b = rest0.bounds(), ox = -(b.min[0] + b.max[0]) / 2, oz = -(b.min[2] + b.max[2]) / 2;
  for (const [v, mat] of [[rest, voxelMaterial()], [emit, glowMaterial()], [metal, L?.material('metal')], [glass, L?.material('glass')]]) {
    if (!v.size) continue;
    const m = new THREE.Mesh(v.toGeometry({ scale: 1 / 16 }), mat);
    m.position.set(ox / 16, 0, oz / 16); m.castShadow = mat !== glowMaterial(); m.receiveShadow = true; g.add(m);
  }
  put(g, 2.6, 5.4);
  voxInfo = { voxels: vox.voxels.size, size: vox.size };
} catch (e) { console.error('[lookdev] farol.vox', e); }

// de noche los faroles prenden una luz cálida (la del juego la pone ambience-fx con el brillo de los materiales)
const night = amb.look?.glow || 0;
const LAMPS = [[3.9, 1.45, 4.7], [2.6, 1.3, 5.4]];
if (!L) for (const [x, y, z] of LAMPS) {
  const pl = new THREE.PointLight(0xffc46a, night * 5, 4.5, 1.6);
  pl.position.set(x, 1.45, z); world.add(pl);
}
if (L) {
  L.adopt(world);
  L.setPoints(LAMPS.map(([x, y, z]) => ({ position: new THREE.Vector3(x - center.x, y, z - center.z), color: 0xffb060, intensity: night * LAMP_I, radius: 5.5 })));
}
// luz del ambiente → render fotográfico. El sol manda sobre el cielo (sombras con contraste) y la noche es de verdad:
// casi sin relleno, para que lo único que se vea bien sea lo que alumbran faroles y ventanas.
const PHYS = !!L && q.get('sky') !== 'flat', SUN_E = num('sune', 2.2), SKY_E = num('skye', 24), NIGHT_K = num('nightk', 1.6), MOON_K = num('moonk', 0.12);
const envTrue = new THREE.Vector3(), nightCol = new THREE.Color(), isoSky = new THREE.Vector3();
if (PHYS && camId === 'cine') r.scene.add(L.skyDome());
const envSun = new THREE.Color(), envSky = new THREE.Color(), envGround = new THREE.Color(), envDir = new THREE.Vector3();
function syncEnv() {
  if (!L) return;
  const n = amb.look?.glow || 0, dim = 1 - NIGHT_DIM * n;
  envSun.copy(lights.sun.color).multiplyScalar(lights.sun.intensity / Math.PI * SUN_K * dim);
  envSky.copy(lights.hemi.color).multiplyScalar(lights.hemi.intensity / Math.PI * SKY_K * dim);
  envGround.copy(lights.hemi.groundColor).multiplyScalar(lights.hemi.intensity / Math.PI * SKY_K * 0.55 * dim);
  // el sol del juego viene de atrás de la cámara (sombras escondidas). Acá entra de costado y baja con la hora,
  // como una lámpara de estudio sobre la maqueta; de noche es la luna, alta y del otro lado. ?sun=azimut,altura (grados)
  let az, el;
  if (q.has('sun')) [az, el] = q.get('sun').split(',').map(Number);
  else if (amb.look?.night) { az = 150; el = 58; }
  else { const k = Math.sin(Math.PI * Math.max(0, Math.min(1, (hour - 5.5) / 14.5))); az = -62 + (hour - 12) * 7; el = 12 + 46 * k; }
  // Cielo físico (default; ?sky=flat vuelve al color plano): el sol de verdad sale a las 6 y se pone a las 20, y de su
  // altura salen el color del cielo, el del sol (más rojo y débil cuando baja) y la luz ambiente. Bajo el horizonte
  // queda la luna, apenas, y el cielo de noche: lo que alumbra es la aldea. El clima de ambience.js lo nubla y lo apaga.
  let phys;
  if (PHYS) {
    const D = Math.PI / 180, wd = WEATHER[weather].dark || 0, nn = amb.look?.phase?.night ?? n;
    const elT = q.has('sun') ? el : 60 * Math.sin(Math.PI * (hour - 6) / 14), azT = q.has('sun') ? az : -62 + (hour - 12) * 7;
    envTrue.set(Math.sin(azT * D) * Math.cos(elT * D), Math.sin(elT * D), Math.cos(azT * D) * Math.cos(elT * D));
    phys = { sunDir: envTrue, strength: SKY_E * (1 - 0.55 * wd), mie: 0.05 + 0.12 * wd, cloud: Math.min(1, wd * 1.4), night: nightCol.setRGB(0.012, 0.02, 0.045).multiplyScalar(NIGHT_K * (1 - 0.5 * wd)) };
    L.setEnv({ physSky: phys });
    if (elT > 0.5) { az = azT; el = Math.max(elT, 3); L.skySun(envSun, SUN_E); }
    else { az = 150; el = 58; envSun.setRGB(0.5, 0.62, 1).multiplyScalar(MOON_K * nn * (1 - 0.8 * wd)); }
  }
  az *= Math.PI / 180; el *= Math.PI / 180;
  envDir.set(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
  if (PHYS) {
    L.setEnv({ sunDir: envDir, sun: envSun, physSky: phys, glow: n, bounce: BOUNCE, gMin: num('gmin', 1), gMix: num('gmix', 0.1), aoFloor: num('aofloor', 0), aoPow: num('aopow', 1), fog: { density: FOG * (1 + 2.5 * n), height: -1.7, falloff: 0.9, glow: 0.6 } });
    // el fondo: en la cámara de cine lo pinta el domo; en la isométrica (rayos paralelos) queda el color del horizonte
    if (camId === 'iso' && r.scene.background?.isColor) L.skyColor(isoSky.set(-0.69, 0.2, -0.69).normalize(), r.scene.background);
    return;
  }
  // la niebla se queda abajo, sobre el agua y el pie del acantilado, y de noche espesa: la luz de los faroles se ve en el aire
  L.setEnv({ sunDir: envDir, sun: envSun, sky: envSky, ground: envGround, glow: n, bounce: BOUNCE, gMin: num('gmin', 1), gMix: num('gmix', 0.1), aoFloor: num('aofloor', 0), aoPow: num('aopow', 1), fog: { density: FOG * (1 + 2.5 * n), height: -1.7, falloff: 0.9, glow: 0.6 } });
}

// ---------- cámaras ----------
const target = new THREE.Vector3(0.6, -0.4, 1.2);
if (camId === 'iso') {
  setIsoCamera(r.camera, target, Math.PI / 4, 60, 0.62);
  // maqueta: foco corto también en la isométrica (lo de adelante y lo del fondo se van de foco)
  if (photo && q.get('dof') !== '0') r.setPost({ dof: { focus: 60, range: 4.5, amt: 0.8, bokeh: 4 } });
}
else {
  // cámara de cine: baja, lente larga, mirando a las casas con el acantilado en primer plano
  r.camera.position.set(8.5, 2.1, 12.5);
  const look = new THREE.Vector3(-0.3, 0.9, -0.6);
  r.camera.lookAt(look);
  if (r.postOn && q.get('dof') !== '0') r.setPost({ dof: { focus: r.camera.position.distanceTo(look), range: 4.2, amt: 0.85 } });
}
let frames = 0, tAcc = 0;
r.onFrame((dt, t) => {
  amb.update(dt, { x: 0, z: 0 });
  syncEnv();
  if (!still) { person.userData.update?.(dt, false); seaM.position.y = SEA_Y + Math.sin(t * 0.8) * 0.012; }
  frames++; tAcc += dt;
  if (frames === 6) window.__ready = true;
});
r.start();
const sceneTris = () => { let n = 0; r.scene.traverse(o => { const g = o.geometry; if (o.isMesh && g) n += (g.index ? g.index.count : g.attributes.position.count) / 3 * (o.isInstancedMesh ? o.count : 1); }); return Math.round(n); };
window.__lookdev = {
  r, amb, hour, render, cam: camId, vox: voxInfo, terrainMs, meshStats,
  stats: () => ({ render, cam: camId, hour, postOn: r.postOn, greedy: q.get('greedy') !== '0', async: useAsync, terrainMs: Math.round(terrainMs),
    meshes: meshStats.builds, quads: meshStats.quads, verts: meshStats.verts, faces: meshStats.faces, cacheHits: meshStats.cacheHits, workerBuilds: meshStats.workerBuilds,
    triangles: sceneTris(), fps: tAcc ? Math.round(frames / tAcc) : 0,
    light: L ? { ...L.stats, buildMs: Math.round(L.stats.buildMs), dims: L.bounds.dims } : null }),
  /** Prueba de la subida parcial: suma un bloque que brilla al volumen (solo se rehace y se sube esa zona). */
  poke() { const v = new Voxels(); v.box(0, 0, 0, 4, 4, 4, '#ffcc66'); return L.add(v, new THREE.Matrix4().makeTranslation(0.5, 0, 1.75), { scale: S, emissive: 2 }); },
  /** Rehace y sube el volumen entero (para comparar contra la subida parcial). */
  full() { const b = L.bounds; L.setBounds(b.min, b.min.clone().add(b.size)); },
  /** Costo por cuadro: dibuja n cuadros esperando a la GPU (gl.finish) y devuelve los ms promedio. */
  bench(n = 60) {
    const gl = r.renderer.getContext(), px = new Uint8Array(4);
    const sync = () => { gl.finish(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); };
    r.render(); sync();
    const t = performance.now();
    for (let i = 0; i < n; i++) { r.render(); sync(); }
    const c = r.renderer.domElement;
    return { ms: +((performance.now() - t) / n).toFixed(2), frames: n, buffer: [c.width, c.height], render, gpu: (() => { const e = gl.getExtension('WEBGL_debug_renderer_info'); return e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : '?'; })() };
  },
};
</script>
</body>
</html>
