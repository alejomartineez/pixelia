<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería de personajes</title>
<link rel="icon" href="data:,">
<script type="importmap">{ "imports": { "three": "../vendor/three.min.js" } }</script>
<style>
  html, body { margin: 0; height: 100%; background: #1d1a18; font-family: sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  .lbl { position: fixed; transform: translate(-50%, 0); font: 600 11px sans-serif; color: #e8dcc6; background: #0008; padding: 1px 4px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
</style>
</head>
<body>
<div id="view"></div>
<script type="module">
// Fila de personajes del estilo nuevo (plan §M1 y §M2) para mirar y comparar. La captura: GALLERY_PAGE=people.html
// node tools/gallery-shot.mjs "set=pueblos" ../shots/personajes/pueblos.png 1500 700
//   set: pueblos | gente (randomLook) | ropa | cabeza | cara | equipo | clases | enemigos
//   cols, vs (alto visible), ang, pitch, walk=1 (caminando)
import * as THREE from 'three';
import { createPixelRenderer, addLights, setIsoCamera } from '../src/core/voxel.js';
import { AVATAR_TYPES, DRESS_STYLES, CROWNS, FACES, ACCESSORIES, HAIR_STYLES } from '../src/core/data.js';
import { avatarModel, randomLook, classLook, CLASS_KIT } from '../src/avatar/avatar.js';
import { enemyModel, ENEMY_MODEL_TYPES } from '../src/combat/enemy-models.js';
window.__ready = false;
const q = new URLSearchParams(location.search);
const set = q.get('set') || 'pueblos';
const items = [];
const base = (id, extra = {}) => ({ ...AVATAR_TYPES.find(t => t.id === id).look, type: id, ...extra });
if (set === 'pueblos') {
  for (const t of AVATAR_TYPES) for (const b of ['recio', 'esbelto']) items.push({ obj: avatarModel(base(t.id, { build: b, ...(b === 'esbelto' ? { face: 'ninguna', hair: t.id === 'anuro' ? 'cresta_piel' : 'largo', dress: 'vestido', dressColor: 'durazno' } : {}) })), label: `${t.name} · ${b}` });
  items.push({ obj: avatarModel({ ...randomLook(3, { type: 'vaciado' }) }), label: 'Vaciado' });
} else if (set === 'gente') {
  const n = Number(q.get('n') || 18);
  for (let i = 0; i < n; i++) items.push({ obj: avatarModel(randomLook(i * 13 + 5), { npc: !!q.get('npc') }), label: randomLook(i * 13 + 5).type });
} else if (set === 'ropa') {
  const who = q.get('who') || 'humano';
  for (const d of DRESS_STYLES) items.push({ obj: avatarModel(base(who, { dress: d.id, acc: 'ninguno' })), label: d.name });
} else if (set === 'cabeza') {
  const who = q.get('who') || 'humano';
  for (const c of CROWNS) items.push({ obj: avatarModel(base(who, { crown: c.id, acc: 'ninguno' })), label: c.name });
} else if (set === 'cara') {
  const who = q.get('who') || 'humano';
  for (const f of FACES) items.push({ obj: avatarModel(base(who, { face: f.id, acc: 'ninguno' })), label: f.name });
  for (const h of HAIR_STYLES.filter(h => h.types.includes(who))) items.push({ obj: avatarModel(base(who, { hair: h.id, face: 'ninguna', acc: 'ninguno' })), label: h.name });
} else if (set === 'equipo') {
  const who = q.get('who') || 'humano';
  for (const a of ACCESSORIES) items.push({ obj: avatarModel(base(who, { acc: a.id })), label: a.name });
} else if (set === 'clases') {
  AVATAR_TYPES.forEach((t, i) => { const cls = Object.keys(CLASS_KIT)[i % 6]; items.push({ obj: avatarModel(base(t.id), { cls }), label: `${t.id} · ${cls}` }); });
  items.push({ obj: avatarModel(base('humano'), { cls: 'saqueador' }), label: 'humano · saqueador' });
} else if (set === 'giro' || set === 'caras') {   // hoja de giro de las muestras (frente, tres cuartos y espalda); caras: primer plano
  const MUESTRAS = [
    ['Enano con hacha', { type: 'enano', build: 'recio', skin: 1, hair: 'cortito', hairColor: 'pelirrojo', face: 'barba_trenzada', dress: 'cuero', dressColor: q.get('cd') || 'verde', crown: 'casco', acc: 'hacha' }],
    ['Monje', { type: 'humano', build: 'recio', skin: 2, hair: 'rapado', hairColor: 'castano', face: 'barba_corta', dress: 'habito', dressColor: q.get('cm') || 'negro', crown: 'ninguna', acc: 'baston' }],
    ['Pirata gente-zorro', { type: 'zorro', build: 'esbelto', skin: 0, hair: 'corto', hairColor: 'pelirrojo', face: 'parche', dress: 'abrigo', dressColor: q.get('cf') || 'azul', crown: 'bandana', acc: 'espada' }],
  ];
  // who=pueblos: el primer plano o el giro de cada pueblo (recio y esbelto, con su look de base) y un Vaciado
  if (q.get('who') === 'pueblos') {
    MUESTRAS.length = 0;
    const ESB = { humano: { hair: 'coleta', face: 'ninguna', dress: 'jubon', dressColor: 'azul' }, enano: { hair: 'rodete', face: 'barba_trenzada', hairColor: 'rubio', dress: 'delantal' },
      anuro: { hair: 'cresta_piel', dress: 'tunica', dressColor: 'durazno', skin: 3 }, zorro: { hair: 'largo', skin: 2, dress: 'cuero', dressColor: 'verde' },
      orco: { hair: 'coleta', face: 'pintura', dress: 'pieles', dressColor: 'negro', skin: 3 } };
    for (const t of AVATAR_TYPES) {
      MUESTRAS.push([t.name.split(' ')[0] + ' recio', base(t.id)]);
      MUESTRAS.push([t.name.split(' ')[0] + ' esbelto', base(t.id, { build: 'esbelto', ...ESB[t.id] })]);
    }
    MUESTRAS.push(['Vaciado', randomLook(3, { type: 'vaciado' })]);
  }
  // pick=orco,anuro: solo las muestras cuyo nombre lleva alguna de esas palabras
  if (q.get('pick')) { const ks = q.get('pick').toLowerCase().split(','); for (let i = MUESTRAS.length - 1; i >= 0; i--) if (!ks.some(k => MUESTRAS[i][0].toLowerCase().includes(k))) MUESTRAS.splice(i, 1); }
  // caras: primer plano; view=f (frente), t (tres cuartos) o p (perfil); sin view, frente y tres cuartos
  const V = { f: ['frente', 0], t: ['tres cuartos', 0.6], p: ['perfil', Math.PI / 2] };
  const VIEWS = set === 'caras' ? (q.get('view') || 'ft').split('').map(k => V[k]) : [['frente', 0], ['tres cuartos', 0.75], ['espalda', Math.PI]];
  for (const [name, look] of MUESTRAS) for (const [view, turn] of VIEWS) {
    const obj = avatarModel(set === 'caras' ? { ...look, acc: 'ninguno' } : look);   // en el primer plano, sin armas que tapen
    // en el primer plano todas las cabezas quedan a la misma altura (el enano sube sobre un pedestal invisible)
    if (set === 'caras') { obj.updateMatrixWorld(true); obj.userData.lift = 0.9 - obj.userData.parts.head.getWorldPosition(new THREE.Vector3()).y; }
    items.push({ obj, label: name + ' · ' + view, turn });
  }
} else if (set === 'autos') {   // conductores sentados (car.js): que el cuerpo nuevo no atraviese el auto
  const { carModel } = await import('../src/avatar/car.js');
  const peoples = ['humano', 'enano', 'orco', 'anuro', 'zorro'];
  peoples.forEach((t, i) => items.push({ obj: carModel({}, { driver: base(t, i % 2 ? { build: 'esbelto' } : {}) }), label: t }));
} else if (set === 'esquifes') {   // el esquife volador (plan §M5): cascos, aparejos y proas; part=casco|vela|proa
  const { carModel } = await import('../src/avatar/car.js');
  const { CAR_BODIES, CAR_WHEELS, CAR_TOPPERS } = await import('../src/core/data.js');
  const part = q.get('part') || 'casco', color = q.get('color') || 'azul';
  const list = part === 'vela' ? CAR_WHEELS.map(w => ({ body: 'bote', wheels: w.id, topper: 'farol', color, n: w.name }))
    : part === 'proa' ? CAR_TOPPERS.map(p => ({ body: 'balandra', wheels: 'vela', topper: p.id, color, n: p.name }))
    : CAR_BODIES.map(b => ({ body: b.id, wheels: 'vela', topper: 'ninguno', color, n: b.name }));
  list.forEach((c, i) => items.push({ obj: carModel(c, q.get('driver') ? { driver: base(['humano', 'enano', 'orco', 'anuro', 'zorro'][i % 5]) } : {}), label: c.n }));
} else if (set === 'enemigos') {
  for (const id of (q.get('ids') ? q.get('ids').split(',') : ENEMY_MODEL_TYPES)) items.push({ obj: enemyModel(id), label: id });
}
if (set === 'retratos') {   // retratos de la Bitácora (story-ui.js → portrait)
  const { portrait } = await import('../src/story/story-ui.js');
  const { CHARACTERS } = await import('../src/story/story-data.js');
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;inset:0;display:flex;gap:28px;align-items:center;justify-content:center;background:#1d1a18';
  for (const id of Object.keys(CHARACTERS)) {
    const cv = portrait(id, ''); if (!cv) continue;
    cv.style.cssText = 'width:192px;height:192px;image-rendering:pixelated;border:3px solid #5a4c3e;border-radius:12px';
    const fig = document.createElement('figure'); fig.style.cssText = 'margin:0;text-align:center;font:600 14px sans-serif;color:#e8dcc6';
    fig.append(cv, Object.assign(document.createElement('figcaption'), { textContent: CHARACTERS[id].name + ' · ' + CHARACTERS[id].title }));
    wrap.append(fig);
  }
  document.body.append(wrap);
}
// gray=1: la misma captura en escala de grises, para chequear el contraste de valor (docs/ARTE-PERSONAJES.md §3)
if (q.get('gray')) document.body.style.filter = 'grayscale(1)';
const cols = Number(q.get('cols') || Math.min(items.length, 8));
const rows = Math.ceil(items.length / cols);
const gap = Number(q.get('gap') || (set === 'enemigos' ? 1.9 : set === 'esquifes' ? 2.3 : 1.05)), pitch = Number(q.get('pitch') || 0.32), rowGap = Number(q.get('rowgap') || (set === 'enemigos' || set === 'esquifes' ? 2.6 : 1.5)) / Math.sin(pitch);
const r = createPixelRenderer(document.getElementById('view'), { viewSize: Number(q.get('vs') || Math.max(rows * rowGap * Math.sin(pitch) + 0.3, (cols * gap + 0.2) * innerHeight / innerWidth)), background: 0x26221f, outline: true });
addLights(r.scene, { shadowSize: 30, shadowRes: 2048 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshLambertMaterial({ color: 0x3a342c }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; r.scene.add(ground);
items.forEach((it, i) => {
  const cx = (i % cols - (cols - 1) / 2) * gap, rz = Math.floor(i / cols) * rowGap;
  it.obj.position.set(cx, it.obj.userData.lift || 0, -rz);
  it.obj.rotation.y = it.turn ?? Number(q.get('turn') || 0.45);
  r.scene.add(it.obj);
});
setIsoCamera(r.camera, new THREE.Vector3(0, Number(q.get('ty') || 0.5), -(rows - 1) * rowGap / 2), Number(q.get('ang') || 0), 60, pitch);
const walk = !!q.get('walk');
r.onFrame((dt) => { for (const it of items) it.obj.userData.update?.(dt, walk, performance.now() / 1000); });
r.start();
if (!q.get('nolabels')) {
  requestAnimationFrame(() => items.forEach((it) => {
    const p = r.toScreen(new THREE.Vector3(it.obj.position.x, -0.08, it.obj.position.z));
    const d = document.createElement('div'); d.className = 'lbl'; d.textContent = it.label; d.style.left = p.x + 'px'; d.style.top = p.y + 'px'; document.body.append(d);
  }));
}
setTimeout(() => { window.__ready = true; }, 400);
</script>
</body>
</html>
