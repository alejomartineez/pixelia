<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería de modelos</title>
<link rel="icon" href="data:,">
<script type="importmap">{ "imports": { "three": "../vendor/three.min.js" } }</script>
<style>
  html, body { margin: 0; height: 100%; background: #bfe9ff; font-family: sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  .lbl { position: fixed; transform: translate(-50%, 0); font: 600 11px sans-serif; color: #3b2340; background: #fff8; padding: 1px 4px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
  #thumbs { position: fixed; inset: 0; display: none; flex-wrap: wrap; gap: 8px; padding: 8px; align-content: flex-start; background: #fff4e6; overflow: auto; }
  #thumbs figure { margin: 0; text-align: center; font: 10px sans-serif; color: #3b2340; }
  #thumbs img { width: 96px; height: 96px; image-rendering: pixelated; background: #ffe3f0; border-radius: 8px; display: block; }
</style>
</head>
<body>
<div id="view"></div>
<div id="thumbs"></div>
<script type="module">
import * as THREE from 'three';
import { createPixelRenderer, addLights, setIsoCamera, Voxels } from '../src/core/voxel.js';
import { BUILDINGS, BUILDING_BY_ID } from '../src/core/data.js';
import * as M from '../src/city/models.js';

const q = new URLSearchParams(location.search);
const level = Number(q.get('level') || 1);
const levels = q.get('levels') ? q.get('levels').split(',').map(Number) : null;
let ids = q.get('ids') ? q.get('ids').split(',') : BUILDINGS.filter(b => !q.get('cat') || b.cat === q.get('cat')).map(b => b.id);
const extra = q.get('extra'); // 'nature' | 'cons' | 'cloud'
window.__ready = false;
window.__M = M; window.__BUILDINGS = BUILDINGS;

if (q.get('thumbs')) {
  const el = document.getElementById('thumbs'); el.style.display = 'flex';
  const list = levels ? ids.flatMap(id => levels.map(l => [id, l])) : ids.map(id => [id, level]);
  for (const [id, l] of list) {
    const f = document.createElement('figure');
    const img = new Image(); img.src = await M.thumbnail(id, l);
    f.append(img, document.createTextNode(id + ' ' + l)); el.append(f);
  }
  window.__ready = true;
} else {
  const r = createPixelRenderer(document.getElementById('view'), { viewSize: Number(q.get('vs') || 14), pixelSize: Number(q.get('px') || 0) || undefined });
  addLights(r.scene, { shadowSize: 12, shadowRes: 2048 });
  const items = [];
  if (extra === 'nature') ['tree', 'pine', 'bush', 'rock', 'flowers', 'mushroom'].forEach(k => [0, 1, 2].forEach(s => items.push({ obj: M.natureModel(k, s), size: [1, 1], label: k + s })));
  else if (extra === 'cons') [[1, 1], [2, 2], [3, 3], [4, 4]].forEach(s => items.push({ obj: M.constructionModel(...s), size: s, label: 'obra ' + s }));
  else if (extra === 'cloud') [0, 1, 2, 3, 4].forEach(s => items.push({ obj: M.cloudModel(s), size: [3, 3], label: 'nube ' + s, y: 1 }));
  else if (levels) for (const id of ids) for (const l of levels) items.push({ obj: M.buildingModel(id, l), size: BUILDING_BY_ID[id].size, label: id + ' L' + l });
  else for (const id of ids) items.push({ obj: M.buildingModel(id, level), size: BUILDING_BY_ID[id].size, label: id });
  if (q.get('road')) { // grilla de caminos 3x3 para ver el patrón
    for (const id of ['camino', 'camino_rosa', 'camino_dorado']) items.push({ grid: id, size: [3, 3], label: id + ' 3x3' });
  }
  const cols = Number(q.get('cols') || Math.ceil(Math.sqrt(items.length)));
  const rows = Math.ceil(items.length / cols);
  const placed = [];
  items.forEach((it, i) => {
    const [w, d] = it.size;
    const ox = 0, oz = 0;
    const gv = new Voxels(); gv.box(0, 0, 0, w * 8 + 4, 1, d * 8 + 4, (a, b, c) => ((a + c) % 2 ? '#8fdc7a' : '#86d672'));
    const gm = gv.toMesh({ scale: 1 / 8, center: 'xz' }); gm.position.set(ox, -1 / 8, oz); r.scene.add(gm);
    if (it.grid) {
      it.obj = new THREE.Group();
      for (let a = 0; a < 3; a++) for (let k = 0; k < 3; k++) { const o = M.buildingModel(it.grid, 1); o.position.set(a - 1, 0, k - 1); it.obj.add(o); }
    }
    it.obj.position.set(ox, it.y || 0, oz);
    if (q.get('rot')) it.obj.rotation.y = Number(q.get('rot')) * Math.PI / 2;
    r.scene.add(it.obj); placed.push(it.obj);
    it.ground = gm;
  });
  r.scene.updateMatrixWorld(true);
  r.stop();
  const cam = r.camera, R = r.renderer;
  R.setScissorTest(true);
  const v3 = new THREE.Vector3();
  function fit(it, cw, ch) {
    const box = new THREE.Box3().expandByObject(it.obj).expandByObject(it.ground);
    const c = box.getCenter(new THREE.Vector3());
    setIsoCamera(cam, c, Math.PI / 4 + Number(q.get('ang') || 0), 60);
    cam.updateMatrixWorld();
    let mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9;
    for (let i = 0; i < 8; i++) { v3.set(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z).applyMatrix4(cam.matrixWorldInverse); mnx = Math.min(mnx, v3.x); mxx = Math.max(mxx, v3.x); mny = Math.min(mny, v3.y); mxy = Math.max(mxy, v3.y); }
    const asp = cw / ch; const pad = 1.06;
    let hh = (mxy - mny) / 2 * pad, hw = (mxx - mnx) / 2 * pad;
    if (hw / hh > asp) hh = hw / asp; else hw = hh * asp;
    const cx = (mnx + mxx) / 2, cy = (mny + mxy) / 2;
    cam.left = cx - hw; cam.right = cx + hw; cam.top = cy + hh; cam.bottom = cy - hh; cam.updateProjectionMatrix();
  }
  const t0 = Number(q.get('t') || 0);
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const t = now / 1000 + t0, dt = Math.min(0.05, (now - last) / 1000); last = now;
    for (const o of placed) { o.userData.update?.(dt, t); o.children.forEach(ch => ch.userData.update?.(dt, t)); }
    const W = innerWidth, H = innerHeight, cw = W / cols, ch = H / rows;
    R.setScissor(0, 0, W, H); R.setViewport(0, 0, W, H); R.clear();
    items.forEach((it, i) => {
      const cx = (i % cols) * cw, cy = H - (Math.floor(i / cols) + 1) * ch;
      R.setViewport(cx, cy, cw, ch); R.setScissor(cx, cy, cw, ch);
      items.forEach(o => { o.obj.visible = o === it; o.ground.visible = o === it; });
      fit(it, cw, ch);
      R.render(r.scene, cam);
    });
  }
  requestAnimationFrame(frame);
  if (!q.get('nolabels')) {
    const cw = innerWidth / cols, ch = innerHeight / rows;
    items.forEach((it, i) => { const d = document.createElement('div'); d.className = 'lbl'; d.textContent = it.label; d.style.left = ((i % cols) * cw + cw / 2) + 'px'; d.style.top = (Math.floor(i / cols) * ch + 4) + 'px'; document.body.append(d); });
  }
  setTimeout(() => { window.__ready = true; }, 300);
  window.__r = r;
}
</script>
</body>
</html>
