  <!-- Preloader: CSS crítico inline. Se pinta antes de que llegue cualquier otro archivo (estilos, fuente, JS). -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #16161c; }
    @font-face { font-family: 'JerseyBoot'; src: url('fonts/jersey10.woff2') format('woff2'); font-display: swap; size-adjust: 122%; }
    #splash { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 90; display: flex; align-items: center; justify-content: center;
      cursor: pointer; overflow: hidden; text-align: center; color: #ece4d6; letter-spacing: .02em;
      font-family: 'JerseyBoot', var(--font-lang, 'Jersey'), ui-rounded, system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
      background: linear-gradient(#11131c, #1d2030 48%, #2e2621); transition: opacity .45s, transform .45s; }
    #splash.hide { opacity: 0; transform: scale(1.08); pointer-events: none; }
    #splash.passive { pointer-events: none; cursor: default; }
    /* otro idioma: los textos esperan a que main.js los traduzca (src/core/i18n.js) */
    html.i18n-wait #splash [data-i18n], html.i18n-wait .boot-tip { visibility: hidden; }
    .splash-sky { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background-image:
      radial-gradient(circle at 20% 25%, #fff 0 3px, transparent 4px), radial-gradient(circle at 75% 15%, #fff 0 2px, transparent 3px),
      radial-gradient(circle at 85% 60%, #fff 0 3px, transparent 4px), radial-gradient(circle at 10% 70%, #fff 0 2px, transparent 3px),
      radial-gradient(circle at 60% 85%, #fff 0 2px, transparent 3px), radial-gradient(circle at 35% 8%, #fff 0 2px, transparent 3px);
      animation: boot-twinkle 2.4s steps(2) infinite; }
    .splash-inner { position: relative; padding: 16px; }
    .boot-crown { display: block; width: 112px; height: 80px; margin: 0 auto; filter: drop-shadow(0 6px 0 rgba(0,0,0,.45)); animation: boot-bob 1.6s steps(4) infinite; }
    .boot-title { margin: 18px 0 0; line-height: 0; font-size: 0; }
    .boot-word { width: 301px; height: 91px; }
    .splash-sub { margin: 14px 0 0; font-size: 24px; font-weight: 700; }
    /* barra y "Tocá para jugar" ocupan la misma altura: al pasar de una al otro el logo no salta */
    .boot-load { display: none; width: 260px; max-width: 72vw; height: 64px; margin: 34px auto 0; }
    .js .boot-load { display: block; }
    .boot-bar { height: 22px; padding: 2px; box-sizing: border-box; border: 3px solid #6a6157; border-radius: 7px; background: #1c1917; box-shadow: 0 4px 0 #080605; overflow: hidden; }
    .boot-bar i { display: block; width: 0; height: 100%; border-radius: 3px; transition: width .35s linear;
      background: repeating-linear-gradient(90deg, #ee8a5c 0 6px, #c8673d 6px 8px); animation: boot-stripes .5s steps(4) infinite; }
    .boot-tip { margin: 12px -40px 0; min-height: 1.3em; font-size: 19px; color: #4b3a32; white-space: nowrap; }
    .splash-tap { display: none; height: 64px; margin: 34px 0 0; font-size: 22px; line-height: 64px; }
    #splash.ready .boot-load { display: none; }
    #splash.ready .splash-tap { display: block; animation: boot-blink 1.1s steps(2) infinite; }
    #splash.boot-fail .boot-load { display: none; }
    .boot-err { width: 300px; max-width: 84vw; box-sizing: border-box; margin: 22px auto 0; padding: 14px 16px 16px; font-size: 18px; line-height: 1.15;
      background: #2a2522; border: 3px solid #6a6157; border-radius: 10px; box-shadow: 0 4px 0 #080605; cursor: default; pointer-events: auto; }
    .boot-err b { display: block; margin-bottom: 6px; font-size: 22px; }
    .boot-err span { display: block; color: #c2b6a4; }
    .boot-err button { margin-top: 12px; padding: 6px 22px 9px; font: inherit; font-size: 20px; color: #fff; cursor: pointer;
      background: #b15836; border: 3px solid #120f0d; border-radius: 10px; box-shadow: inset 0 -5px 0 #8c4428, 0 4px 0 #080605; text-shadow: 0 2px 0 rgba(61,47,42,.35); }
    .boot-err[hidden] { display: none; }
    .boot-noscript { margin: 30px auto 0; font-size: 20px; }
    @media (min-width: 720px) and (min-height: 720px) { .boot-word { width: 430px; height: 130px; } .boot-crown { width: 140px; height: 100px; } .splash-sub { font-size: 30px; } }
    @media (max-width: 380px) { .boot-word { width: 258px; height: 78px; } .boot-crown { width: 98px; height: 70px; } }
    @media (max-height: 520px) { .boot-crown { width: 84px; height: 60px; } .boot-load, .splash-tap { margin-top: 20px; } }
    @media (prefers-reduced-motion: reduce) { html:not(.motion-full) :is(.splash-sky, .boot-crown, .boot-bar i) { animation: none; } }
    /* Logo del estudio (Dezings): antes del splash, mientras bajan los módulos. Variantes de color: st-dez (la de
       siempre: el azul y blanco de Dezings), st-brasa, st-cefiro, st-veta (?studio=veta para probar). .fast = segunda vez en adelante; .still = sin movimiento. */
    #studio { --T: 1; position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 95; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 45%, var(--st-bg2), var(--st-bg) 70%); cursor: pointer; -webkit-user-select: none; user-select: none;
      transition: opacity calc(.32s * var(--T)); }
    #studio.fast { --T: .56; }
    #studio.out { opacity: 0; pointer-events: none; }
    .st-dez { --st-bg: #070b1c; --st-bg2: #16224d; --st-top: #7d93ec; --st-left: #3d55b8; --st-right: #253887; --st-glow: #dfe7ff;
      --st-ink: #050816; --st-face: #ffffff; --st-face2: #dbe3ff; --st-shadow: #3d55b8; }
    .st-brasa { --st-bg: #120d1a; --st-bg2: #241a33; --st-top: #ffb27a; --st-left: #ee7a4a; --st-right: #a8432f; --st-glow: #ffe1b8;
      --st-ink: #0b0710; --st-face: #fff6ec; --st-face2: #ffd9bf; --st-shadow: #ee7a4a; }
    .st-cefiro { --st-bg: #0b141b; --st-bg2: #14303a; --st-top: #a6f3e6; --st-left: #4fc9b8; --st-right: #23807f; --st-glow: #e3fffa;
      --st-ink: #061015; --st-face: #f2fffc; --st-face2: #c4efe7; --st-shadow: #2fa79a; }
    .st-veta { --st-bg: #0f0b1d; --st-bg2: #231a45; --st-top: #cdb2ff; --st-left: #9271ff; --st-right: #5638c4; --st-glow: #f0e6ff;
      --st-ink: #08061a; --st-face: #fbf8ff; --st-face2: #ded2ff; --st-shadow: #7b55ff; }
    .st-inner { display: flex; flex-direction: column; align-items: center; gap: 26px; }
    .st-cube { display: block; width: 108px; height: 108px; animation: st-drop calc(.46s * var(--T)) cubic-bezier(.3, 1.5, .5, 1) both;
      filter: drop-shadow(0 10px 0 rgba(0,0,0,.35)); }
    .st-cube svg, .st-l svg { display: block; width: 100%; height: 100%; }
    .st-word { display: flex; gap: 6px; }
    .st-l { display: block; width: calc(var(--w, 9) * 6px); height: 84px; opacity: 0;
      animation: st-fall calc(.4s * var(--T)) cubic-bezier(.25, 1.4, .5, 1) calc((.28s + var(--i) * .07s) * var(--T)) forwards,
                 st-flash calc(.22s * var(--T)) ease-out calc((1.02s + var(--i) * .04s) * var(--T)); }
    .st-l:nth-child(4) { --w: 8; }
    @keyframes st-drop { from { transform: translateY(-55vh) rotate(-8deg); } to { transform: none; } }
    @keyframes st-fall { from { opacity: 1; transform: translateY(-120px); } to { opacity: 1; transform: none; } }
    @keyframes st-flash { 40% { filter: brightness(1.7) drop-shadow(0 0 10px var(--st-glow)); } }
    #studio.still .st-cube, #studio.still .st-l { animation: none; opacity: 1; }
    @media (min-width: 1100px) and (min-height: 700px) { .st-cube { width: 150px; height: 150px; } .st-l { width: calc(var(--w, 9) * 8px); height: 112px; } .st-word { gap: 8px; } .st-inner { gap: 34px; } }
    @media (max-width: 520px) { .st-cube { width: 80px; height: 80px; } .st-l { width: calc(var(--w, 9) * 4.4px); height: 62px; } .st-word { gap: 4px; } }
    .splash-by { position: absolute; left: 0; right: 0; bottom: 14px; margin: 0; font-size: 17px; color: #aea392; opacity: .85; }
    @keyframes boot-twinkle { 50% { opacity: .4; } }
    @keyframes boot-bob { 50% { transform: translateY(-8px); } }
    @keyframes boot-blink { 50% { opacity: .25; } }
    @keyframes boot-stripes { to { background-position: 8px 0; } }

  <!-- Progreso real del arranque. Script clásico y viejo-compatible (si el navegador no soporta módulos, muestra el aviso).
       main.js avisa con window.__boot: started() → ready() (toca para jugar) / start() → done(). -->
  <script>
  (function () {
    var d = document, de = d.documentElement;
    de.className += ' js';
    // peso de cada parte en la barra (suma 100): estilos, fuente, módulos del arranque (main.js y core), three.js y la primera escena
    var WEIGHT = { css: 8, font: 7, mods: 25, three: 30, scene: 30 }, MODS = 18;
    var TIPS = ['Plantando árboles…', 'Pintando techos…', 'Aflojando las nubes…', 'Barriendo las veredas…', 'Regando las flores…',
      'Encendiendo los faroles…', 'Horneando medialunas…', 'Dándole cuerda al reloj…', 'Revisando el mapa viejo…', 'Atando los botes…',
      'Despertando al barrio…', 'Afinando la calesita…', 'Acomodando la plaza…', 'Mirando qué hay debajo de las islas…'];
    var MSG = {
      slow: ['Esto está tardando más de la cuenta…', 'Si tu conexión anda lenta, esperá un poco más o probá de nuevo.'],
      fail: ['No pudimos abrir Pixelia', 'Revisá tu conexión a internet y probá de nuevo.'],
      old: ['Tu navegador no es compatible', 'Pixelia necesita un navegador actualizado: Safari 16.4 o más nuevo, o Chrome, Edge o Firefox recientes.']
    };
    // Idioma (src/core/i18n.js): ?lang=, el guardado en Ajustes o el del sistema. Si no es español, los textos del
    // splash quedan ocultos (html.i18n-wait) hasta que main.js los traduce con __boot.lang(); si el arranque falla,
    // los avisos salen en inglés.
    var LANG = 'es', OPEN = '¡Abriendo las puertas!';
    try {
      var qp = /[?&]lang=([\w-]+)/.exec(location.search), sv = null;
      if (!qp) { try { sv = JSON.parse(localStorage.getItem('pixelia.save.v1') || 'null'); } catch (e) {} }
      var want = qp ? qp[1] : (sv && sv.settings && sv.settings.lang) || (navigator.webdriver ? 'es' : '') || (navigator.languages && navigator.languages[0]) || navigator.language || 'es';
      LANG = String(want).toLowerCase().split(/[-_]/)[0] || 'es';
    } catch (e) {}
    if (LANG !== 'es') {
      de.className += ' i18n-wait';
      MSG = {
        slow: ['This is taking longer than usual…', 'If your connection is slow, wait a bit longer or try again.'],
        fail: ['Pixelia could not start', 'Check your internet connection and try again.'],
        old: ['Your browser is not supported', 'Pixelia needs an up-to-date browser: Safari 16.4 or newer, or a recent Chrome, Edge or Firefox.']
      };
    }
    var got = {}, nMods = 0, phase = 'load', started = false, slowShown = false, wasReady = false;
    var t0 = +new Date(), tMark = t0, shown = 0, tipT = t0, tipI = 1 + Math.floor(Math.random() * (TIPS.length - 1));
    var cssDone = false, cssWait = [], lastNet = t0;
    // cada archivo que termina de bajar cuenta como "sigue vivo" (el aviso de lentitud sale solo si la red se trabó)
    try { new PerformanceObserver(function () { lastNet = +new Date(); }).observe({ type: 'resource' }); } catch (e) {}
    function $(id) { return d.getElementById(id); }
    function total() { var s = 0; for (var k in got) s += got[k]; return s > 100 ? 100 : s; }
    function tick(k, f) {
      var v = (WEIGHT[k] || 0) * (f == null ? 1 : Math.min(1, f));
      if (!(got[k] >= v)) { got[k] = v; tMark = lastNet = +new Date(); }
    }
    function cls(add, rm) {
      var s = $('splash'); if (!s) return;
      var c = (' ' + s.className + ' ').replace(' ' + (rm || add) + ' ', ' ') + (rm ? '' : add);
      s.className = c.replace(/^ +| +$/g, '');
    }
    function msg(kind) {
      var box = $('boot-err'); if (!box) return;
      box.getElementsByTagName('b')[0].textContent = MSG[kind][0];
      box.getElementsByTagName('span')[0].textContent = MSG[kind][1];
      box.hidden = false;
      if (kind !== 'slow') cls('boot-fail');
      de.className = de.className.replace(' i18n-wait', '');
    }
    function clearMsg() { var box = $('boot-err'); if (box) box.hidden = true; cls('', 'boot-fail'); }
    function paint() {
      var now = +new Date(), t = total(), p;
      // ?nosplash / ?scene= arrancan la escena sin pasar por ready(): mientras baja, la barra sigue siendo la real
      var loading = phase === 'load' || (phase === 'start' && !wasReady);
      if (loading) {
        // avance suave hacia lo que falta, que nunca llega solo a 100: el último tramo lo da main.js
        p = t + (100 - t) * 0.5 * (1 - Math.exp(-(now - tMark) / 5000));
        if (p > 96) p = 96;
      } else p = phase === 'fail' ? shown : 100;
      if (p > shown) shown = p;
      var fill = $('boot-fill');
      if (fill) { fill.style.width = shown.toFixed(1) + '%'; fill.parentNode.setAttribute('aria-valuenow', Math.round(shown)); }
      var tip = $('boot-tip');
      if (tip && loading && now - tipT > 2300) { tipT = now; tip.textContent = TIPS[tipI++ % TIPS.length]; }
      // ~15 s sin terminar y sin que llegue ningún archivo hace 8 s (red trabada o algo colgado): aviso amable con "Reintentar".
      // Con red lenta pero viva no molesta; si el JS falla con error, fail() avisa antes.
      if (loading && !slowShown && now - t0 > 15000 && now - lastNet > 8000) { slowShown = true; msg('slow'); }
    }
    var timer = setInterval(paint, 120);
    window.__boot = {
      tick: tick,
      mod: function () { nMods++; tick('mods', nMods / MODS); },
      started: function () { started = true; tick('mods'); if (phase === 'fail') { phase = 'load'; clearMsg(); } },
      ready: function () { if (phase === 'done') return; phase = 'ready'; wasReady = true; clearMsg(); paint(); },
      start: function () { if (phase === 'done') return; phase = 'start'; if (!wasReady) return; clearMsg(); var tip = $('boot-tip'); if (tip) tip.textContent = OPEN; paint(); },
      done: function () { phase = 'done'; clearMsg(); paint(); clearInterval(timer); },
      fail: function (kind) { if (phase === 'done') return; phase = 'fail'; cls('', 'ready'); msg(kind || 'fail'); },
      css: function () { if (cssDone) return; cssDone = true; tick('css'); for (var i = 0; i < cssWait.length; i++) cssWait[i](); cssWait = []; },
      whenCss: function (cb) { if (cssDone) cb(); else cssWait.push(cb); },
      // main.js, con el idioma cargado: { tips: [...], slow: [t, x], fail: [t, x], open: '...' }
      lang: function (o) {
        if (o.tips && o.tips.length) { TIPS = o.tips; var tip = $('boot-tip'); if (tip && phase !== 'start') tip.textContent = TIPS[tipI % TIPS.length]; }
        if (o.slow) MSG.slow = o.slow;
        if (o.fail) MSG.fail = o.fail;
        if (o.open) OPEN = o.open;
        de.className = de.className.replace(' i18n-wait', '');
      }
    };
    // error antes de que arranque main.js = algún módulo no cargó; si después arranca igual, el aviso se va solo
    window.addEventListener('error', function () { if (!started) setTimeout(function () { if (!started) window.__boot.fail(); }, 1500); });
    // Safari < 16.4 no tiene import maps (three se importa como "three")
    if (window.HTMLScriptElement && HTMLScriptElement.supports && !HTMLScriptElement.supports('importmap')) setTimeout(function () { window.__boot.fail('old'); }, 0);
  })();
  </script>
