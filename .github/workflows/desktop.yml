# Juego de PC: compila Pixelia con Tauri para Windows (.exe NSIS) y macOS (.dmg universal: Intel + Apple Silicon).
#  - Tag vN (lo crea `npm run release` en tools/): arma un borrador de release con los instaladores y el latest.json
#    del actualizador. Sin firma de Apple ni de Windows por ahora (ver README).
#  - Manual (workflow_dispatch): compila solo macOS, abre la app en el runner y sube capturas como artefacto,
#    para probar Mac sin tener una.
name: desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mac_smoke:
        description: 'Compilar en macOS, abrir la app y sacar capturas'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis'
          - os: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: npm ci
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'Pixelia ${{ github.ref_name }}'
          releaseBody: 'Instaladores de Pixelia para Windows y macOS. La primera vez, mirá el README para abrirlo sin firma.'
          releaseDraft: true
          includeUpdaterJson: true

  win-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: npm ci
        working-directory: desktop
      - name: Compilar el instalador de prueba
        working-directory: desktop
        run: npx tauri build --bundles nsis --config src-tauri/tauri.check.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

  mac-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.mac_smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: npm ci
        working-directory: desktop
      - name: Compilar la app (sin actualizador firmado)
        working-directory: desktop
        run: npx tauri build --bundles app --config src-tauri/tauri.check.conf.json
      - name: Abrir y capturar
        run: |
          mkdir -p shots
          APP="desktop/src-tauri/target/release/bundle/macos/Pixelia.app"
          ls -la "$APP/Contents/MacOS"
          "$APP/Contents/MacOS/pixelia" > shots/app.log 2>&1 &
          for t in 6 14 24 40; do sleep $((t - ${prev:-0})); prev=$t; screencapture -x "shots/mac-${t}s.png" || true; done
          pkill -f "Pixelia.app" || true
      - uses: actions/upload-artifact@v4
        with:
          name: mac-smoke
          path: shots/
